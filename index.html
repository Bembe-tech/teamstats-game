<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>TeamStats.Pro</title>
    <link rel="manifest" href="<%- manifestHref %>" />
    <link rel="icon" type="image/svg+xml" href="<%- faviconHref %>" />

    <!-- Preload styles -->
    <style>
      html {
        color-scheme: dark;
      }

      html.preload {
        visibility: visible !important;
        opacity: 1 !important;
        background-color: #111827 !important;
      }

      html.preload body {
        visibility: hidden;
        opacity: 0;
      }

      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Prevent Playwire bottom rail from affecting flex layout,
         and keep it below the bottom HUD (z-[200]) so it can't cover the control panel */
      [id^="pw-oop-bottom_rail"] {
        position: fixed !important;
        z-index: 150 !important;
      }

      /* Playwire flex leaderboard (header ad): Playwire inlines
         z-index 2147483647 on it — cap it below modals and the mobile drawer,
         like the bottom rail. The sticky nav shifts below it via
         --top-ad-height, and page content via --top-ad-pad, both measured by
         HomepagePromos, so it never covers the menu bar. */
      #pw-oop-flex,
      #adBanner.leaderboard_ad {
        z-index: 150 !important;
      }

      /* Gutter rails (left/right) get the same inline max z-index, which put
         them over the featured Twitch player (z-[45000]) and its close
         button. Cap them like the other units. */
      [id^="pw-oop-left_rail"],
      [id^="pw-oop-right_rail"] {
        z-index: 150 !important;
      }

      /* The flex unit's inline (expanded) state renders into
         #pw-oop-flex_container, a direct <body> child. Body is a flex row,
         which squeezed it to width 0 — the unit could never show its
         expanded state or sense scrolling, so it latched permanently into
         the docked leaderboard. Give it its own full-width line at the top
         of the page (body wraps; the content area follows on the next
         line), so it expands at the top and docks once scrolled past.
         HomepagePromos locks its min-height to the expanded ad height once
         seen, so dock/undock never changes the document height (which would
         jump the scroll position mid-scroll). */
      #pw-oop-flex_container {
        order: -1;
        flex-basis: 100%;
        width: 100%;
      }
      /* While an inline page (store, settings, ...) is open the document is
         locked at scroll 0 (see styles.css), so the unit would sit expanded
         (350px tall) in flow above the modal for as long as the page is open,
         squeezing the modal to a sliver. Playwire docks the unit through an
         IntersectionObserver on this container, so park the container just
         above the viewport instead: the unit then collapses to its fixed
         leaderboard (measured into --top-ad-height, which pads the content
         area below), and re-expands in flow when the page closes. No
         transform here — the docked unit is position: fixed and must keep
         the viewport as its containing block. */
      body.page-open #pw-oop-flex_container {
        position: fixed;
        bottom: 100%;
        left: 0;
        width: 100%;
      }
      /* Playwire docks the unit with position: fixed and top: auto, i.e. at
         its static (in-flow) position — which is now above the viewport. */
      body.page-open #pw-oop-flex {
        top: 0;
      }

      /* Google Funding Choices CCPA link override */
      .fc-dns-link,
      .fc-ccpa-root,
      .fc-consent-root {
        position: fixed !important;
        z-index: 999999 !important;
      }
      .fc-dns-link {
        bottom: 15px !important;
        left: 15px !important;
      }

      /* Ensure full viewport height on iOS; body grows with content so the
         document scrolls (see styles.css) */
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        min-height: 100%;
        min-height: -webkit-fill-available;
      }

      /* Disable iOS double-tap "smart zoom" on the page; the game has its
         own map zoom. Panning/scrolling stays allowed. See issue #4609. */
      html,
      body {
        touch-action: manipulation;
      }
    </style>

    <!-- SEO -->
    <meta
      name="description"
      content="Private game lobbies for streamers and their viewers. A modified build of OpenFront."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="TeamStats.Pro" />
    <meta
      property="og:description"
      content="Private game lobbies for streamers and their viewers. A modified build of OpenFront."
    />
    <meta property="og:image" content="<%- gameplayScreenshotUrl %>" />
    <meta property="og:type" content="game" />

    <!--
      Injected from Server env.

      Every per-server value (cluster, instanceLetter, instanceId, serverHost,
      siteHost) is emitted through a guard so the whole line — indentation and
      trailing comma included — disappears when the renderer does not supply
      it. That is what lets one page be rendered per VERSION rather than per
      server and uploaded to the CDN (docs/MultiServer.md, "Publish pipeline
      (v2)"); a game server supplies them all and gets exactly the page it
      always served.

      Never add a placeholder the Steam shell does not supply: openfront-desktop
      renders this same template itself and a missing local is a ReferenceError,
      i.e. a blank window. Guarding an existing one is safe — the shell supplies
      a value and the line still emits.
    -->
    <script>
      window.BOOTSTRAP_CONFIG = {
        gitCommit: <%- gitCommit %>,
        assetManifest: <%- assetManifest %>,
        cdnBase: <%- cdnBase %>,
        gameEnv: <%- gameEnv %>,<%- typeof cluster !== "undefined" && cluster ? "\n        cluster: " + cluster + "," : "" %><%- typeof instanceLetter !== "undefined" && instanceLetter ? "\n        instanceLetter: " + instanceLetter + "," : "" %>
        turnstileSiteKey: <%- turnstileSiteKey %>,
        jwtAudience: <%- jwtAudience %>,<%- typeof stripePublishableKey !== "undefined" && stripePublishableKey ? "\n        stripePublishableKey: " + stripePublishableKey + "," : "" %><%- typeof faroCollectorUrl !== "undefined" && faroCollectorUrl ? "\n        faroCollectorUrl: " + faroCollectorUrl + "," : "" %><%- typeof instanceId !== "undefined" && instanceId ? "\n        instanceId: " + instanceId + "," : "" %><%- typeof serverHost !== "undefined" && serverHost ? "\n        serverHost: " + serverHost + "," : "" %><%- typeof siteHost !== "undefined" && siteHost ? "\n        siteHost: " + siteHost + "," : "" %>
      };
      // Set here rather than from the bundle so the first paint already has the
      // desktop layout. The shell's preload defines openfrontDesktop before
      // any page script runs. ?desktop-layout previews it outside prod.
      if (
        window.openfrontDesktop ||
        (window.BOOTSTRAP_CONFIG.gameEnv !== "prod" &&
          new URLSearchParams(location.search).has("desktop-layout"))
      ) {
        document.documentElement.classList.add("desktop-shell");
      }
      document.documentElement.style.setProperty(
        "--background-image-url",
        `url("<%- backgroundImageUrl %>")`,
      );
      // document.documentElement.style.setProperty(
      //   "--desktop-logo-image-url",
      //   `url("<%- desktopLogoImageUrl %>")`,
      // );
      document.documentElement.style.setProperty(
        "--mobile-logo-image-url",
        `url("<%- mobileLogoImageUrl %>")`,
      );
    </script>

    <!-- TeamStats.Pro: no OpenFront store, accounts, clans, leaderboard, news or Steam -->
    <style>
      [data-page="page-item-store"], [data-page="page-inventory"],
      [data-page="page-leaderboard"], [data-page="page-clan"],
      nav-account-menu, news-box, streaming-now, steam-wishlist,
      steam-wishlist-button { display: none !important; }
    </style>
    <!-- ts-theme:start -->
    <style id="ts-theme">
/* TeamStats.Pro look for the game's menus (lobby, waiting room, solo):
   the same dark neon panels as teamstats.pro. Inlined into index.html by
   teamstats/inline-theme.cjs (modals copy the page's styles into their
   shadow roots, so plain page CSS reaches them). Fonts: SIL OFL, /ts-fonts. */
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url(/ts-fonts/inter-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Inter';font-style:normal;font-display:swap;font-weight:100 900;src:url(/ts-fonts/inter-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+A720-A7FF}
@font-face{font-family:'Rajdhani';font-style:normal;font-display:swap;font-weight:600;src:url(/ts-fonts/rajdhani-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Rajdhani';font-style:normal;font-display:swap;font-weight:700;src:url(/ts-fonts/rajdhani-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Rajdhani';font-style:normal;font-display:swap;font-weight:700;src:url(/ts-fonts/rajdhani-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+1E00-1E9F}

:root{
  --ts-bg:#05060a;
  --ts-panel:#0d1119;
  --ts-panel2:#121a26;
  --ts-line:#232c3c;
  --ts-text:#edf2f7;
  --ts-muted:#8f9bab;
  --ts-blue:#6ea8ff;
  --ts-neon:#57e6ff;
  --ts-neon2:#b06cff;
  --ts-glow:0 0 0 1px rgba(87,230,255,.45),0 0 26px rgba(87,230,255,.22);
}

/* Page background: teamstats gradient + faint grid instead of the hex map. */
body{
  background:
    radial-gradient(circle at 15% -10%,rgba(87,230,255,.10),transparent 40%),
    radial-gradient(circle at 88% 8%,rgba(176,108,255,.12),transparent 42%),
    radial-gradient(circle at 50% -10%,#172238 0,#05060a 52%) !important;
  background-attachment:fixed !important;
  font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
}
#hex-grid > *{display:none !important}
#hex-grid{
  background-image:
    linear-gradient(rgba(110,168,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(110,168,255,.04) 1px,transparent 1px);
  background-size:42px 42px;
  -webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 75%);
  mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 75%);
}

/* Headings in the display font. */
h1,h2,h3,h4,.ts-h,
.uppercase.tracking-widest,.uppercase.tracking-wider{
  font-family:'Rajdhani','Inter',sans-serif;
  letter-spacing:.06em;
}

/* Modal shell: dark glass panel with a neon edge. */
.ts-panel{
  background:
    linear-gradient(180deg,rgba(18,26,38,.92),rgba(9,12,18,.95)) !important;
  border:1px solid rgba(110,168,255,.22) !important;
  box-shadow:0 0 0 1px rgba(87,230,255,.06),0 24px 80px rgba(0,0,0,.55),0 0 60px rgba(87,230,255,.06);
  border-radius:20px !important;
}
.ts-panel::before{
  content:"";position:absolute;inset:0 0 auto 0;height:2px;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--ts-neon),var(--ts-neon2),transparent);
  opacity:.8;
}

/* Section headings: neon underline. */
.ts-h{
  font-size:1.35rem !important;
  background:linear-gradient(90deg,#fff,#cfe6ff 60%,var(--ts-neon));
  -webkit-background-clip:text;background-clip:text;color:transparent !important;
}
section > div.border-b.border-white\/10:has(> .ts-h){
  border-image:linear-gradient(90deg,rgba(87,230,255,.55),rgba(176,108,255,.35),transparent) 1 !important;
}

/* Option cards (toggles, difficulty, mode). */
.ts-card{
  background:linear-gradient(180deg,rgba(21,29,42,.85),rgba(13,17,25,.9)) !important;
  border-color:var(--ts-line) !important;
  border-radius:14px !important;
}
.ts-card:hover{
  border-color:rgba(110,168,255,.55) !important;
  box-shadow:0 0 0 1px rgba(110,168,255,.25),0 0 18px rgba(110,168,255,.14);
}
.ts-card.ts-on{
  background:
    linear-gradient(180deg,rgba(61,125,255,.22),rgba(87,230,255,.08)) !important;
  border-color:rgba(87,230,255,.7) !important;
  box-shadow:var(--ts-glow) !important;
}
.ts-card.ts-on span{color:#fff !important}

/* Map cards. */
.ts-map{
  background:linear-gradient(180deg,rgba(21,29,42,.85),rgba(13,17,25,.9)) !important;
  border-color:var(--ts-line) !important;
  border-radius:14px !important;
}
.ts-map:hover{border-color:rgba(110,168,255,.55) !important;box-shadow:0 0 18px rgba(110,168,255,.16)}
.ts-map[aria-selected="true"]{
  border-color:rgba(87,230,255,.8) !important;
  box-shadow:var(--ts-glow) !important;
  background:linear-gradient(180deg,rgba(61,125,255,.25),rgba(87,230,255,.08)) !important;
}

/* Team cards in the waiting room. */
.ts-team{
  background:linear-gradient(180deg,rgba(21,29,42,.9),rgba(13,17,25,.92)) !important;
  border-color:var(--ts-line) !important;
  border-radius:14px !important;
  overflow:hidden;
}
.ts-team > div:first-child{
  background:rgba(255,255,255,.04) !important;
  font-family:'Rajdhani','Inter',sans-serif;font-size:15px !important;letter-spacing:.05em;
}

/* Inputs. */
input[type="text"],input[type="number"],input:not([type]){
  border-radius:10px;
}
input:focus{border-color:var(--ts-neon) !important;box-shadow:0 0 0 2px rgba(87,230,255,.18)}

/* Scrollbars like the site. */
.custom-scrollbar::-webkit-scrollbar-thumb{background:#2c3a4d !important;border-radius:8px}
html{scrollbar-color:#2c3a4d #0a0e16}

/* ---------- Home page ---------- */
.ts-verified,.ts-social,.footer-version,#game-version{display:none !important}
.ts-home{display:flex;flex-direction:column;gap:22px;width:100%;padding:8px 16px 24px;box-sizing:border-box}
@media(min-width:640px){.ts-home{padding:8px 0 24px}}
.ts-hero{
  position:relative;overflow:hidden;border-radius:20px;padding:30px 28px;
  background:
    radial-gradient(circle at 85% 0%,rgba(176,108,255,.22),transparent 55%),
    radial-gradient(circle at 10% 100%,rgba(87,230,255,.16),transparent 55%),
    linear-gradient(180deg,rgba(18,26,38,.9),rgba(9,12,18,.92));
  border:1px solid rgba(110,168,255,.22);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.ts-hero::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--ts-neon),var(--ts-neon2),transparent)}
.ts-kicker{font:700 12px/1 'Rajdhani','Inter',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--ts-neon);margin-bottom:10px}
.ts-title{font:700 clamp(28px,4.2vw,46px)/1.05 'Rajdhani','Inter',sans-serif;color:#fff;margin:0;letter-spacing:.02em}
.ts-title span{background:linear-gradient(90deg,var(--ts-neon),var(--ts-blue),var(--ts-neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ts-sub{margin:12px 0 0;max-width:620px;color:var(--ts-muted);font-size:15px;line-height:1.55}
.ts-actions{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.ts-actions{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.ts-actions{grid-template-columns:1.4fr 1fr 1fr}.ts-actions .ts-primary{grid-row:span 2}.ts-actions .ts-small{grid-column:2 / span 2}}
.ts-action{
  display:flex;align-items:center;gap:16px;text-align:left;cursor:pointer;
  padding:20px;border-radius:18px;color:var(--ts-text);
  background:linear-gradient(180deg,rgba(21,29,42,.9),rgba(13,17,25,.94));
  border:1px solid var(--ts-line);
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
}
.ts-action:hover{transform:translateY(-2px);border-color:rgba(110,168,255,.6);box-shadow:0 0 0 1px rgba(110,168,255,.25),0 12px 34px rgba(0,0,0,.4),0 0 24px rgba(110,168,255,.15)}
.ts-action:active{transform:scale(.98)}
.ts-action-ico{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:rgba(110,168,255,.12);border:1px solid rgba(110,168,255,.3);color:var(--ts-blue)}
.ts-ico{width:24px;height:24px}
.ts-action-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ts-action-title{font:700 20px/1.1 'Rajdhani','Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.ts-action-text{font-size:13px;line-height:1.4;color:var(--ts-muted)}
.ts-action-arrow{font-size:28px;line-height:1;color:rgba(255,255,255,.35);transition:transform .15s,color .15s}
.ts-action:hover .ts-action-arrow{transform:translateX(3px);color:var(--ts-neon)}
.ts-primary{
  flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:150px;
  background:
    radial-gradient(circle at 100% 0%,rgba(87,230,255,.25),transparent 55%),
    linear-gradient(135deg,#2f6bff,#3d7dff 45%,#6a4dff);
  border-color:rgba(255,255,255,.18);
}
@media(min-width:1024px){.ts-primary{min-height:100%}}
.ts-primary .ts-action-ico{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff;width:56px;height:56px}
.ts-primary .ts-action-title{font-size:28px}
.ts-primary .ts-action-text{color:rgba(255,255,255,.85);font-size:14px}
.ts-primary .ts-action-arrow{position:absolute;opacity:0}
.ts-primary{position:relative}
.ts-primary:hover{border-color:rgba(255,255,255,.4);box-shadow:0 0 0 1px rgba(87,230,255,.4),0 14px 40px rgba(61,125,255,.35)}
.ts-small{padding:14px 20px}
.ts-small .ts-action-ico{width:38px;height:38px;border-radius:11px;color:var(--ts-gold,#f2c400);background:rgba(242,196,0,.1);border-color:rgba(242,196,0,.3)}
.ts-modes{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ts-modes-label{font:700 12px/1 'Rajdhani','Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ts-muted);margin-right:4px}
.ts-chip{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;color:#dce8ff;background:rgba(110,168,255,.1);border:1px solid rgba(110,168,255,.28)}
/* Logo never wider than its slot (phone top bar). */
img[src*="OpenFrontLogo"]{max-width:min(100%,200px);height:auto !important;max-height:100%;object-fit:contain}
@media(max-width:1023px){img[src*="OpenFrontLogo"]{max-width:140px}}

/* ---------- Create-lobby window: full screen, tabs, side panel ---------- */
host-lobby-modal.page-content:not(.hidden){
  position:fixed;inset:0;z-index:9000;padding:12px;box-sizing:border-box;
  background:
    radial-gradient(circle at 15% -10%,rgba(87,230,255,.10),transparent 40%),
    radial-gradient(circle at 88% 8%,rgba(176,108,255,.12),transparent 42%),
    radial-gradient(circle at 50% -10%,#172238 0,#05060a 52%);
}
@media(min-width:1024px){host-lobby-modal.page-content:not(.hidden){padding:18px 24px}}
.ts-tabs{
  display:flex;gap:6px;padding:10px 16px;overflow-x:auto;flex:none;
  border-bottom:1px solid rgba(255,255,255,.08);scrollbar-width:none;
}
.ts-tabs::-webkit-scrollbar{display:none}
.ts-tab{
  display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;
  padding:9px 16px;border-radius:12px;border:1px solid transparent;
  font:700 15px/1 'Rajdhani','Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ts-muted);background:transparent;transition:all .15s;
}
.ts-tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.ts-tab-on{color:#fff;background:linear-gradient(180deg,rgba(61,125,255,.28),rgba(87,230,255,.08));border-color:rgba(87,230,255,.55);box-shadow:0 0 18px rgba(87,230,255,.15)}
.ts-tab-ico{font-size:14px;line-height:1}
.ts-lobby-main{flex:1;min-height:0;display:flex;flex-direction:column}
.ts-lobby-content{max-width:none !important;margin:0 !important}
.ts-side{
  flex:none;display:flex;flex-direction:column;gap:12px;padding:14px 16px;
  border-top:1px solid rgba(255,255,255,.08);background:rgba(5,6,10,.55);
}
@media(min-width:1024px){
  .ts-lobby-main{flex-direction:row}
  .ts-side{width:340px;border-top:0;border-left:1px solid rgba(255,255,255,.08);overflow-y:auto;padding:18px}
}
.ts-side-map{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(87,230,255,.35);box-shadow:0 0 22px rgba(87,230,255,.12);cursor:pointer;background:#0a0e16}
.ts-side-map img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover}
.ts-side-map-q{aspect-ratio:2/1;display:grid;place-items:center;font:700 54px 'Rajdhani',sans-serif;color:var(--ts-neon)}
.ts-side-map-name{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));font:700 20px/1 'Rajdhani','Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.ts-side-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ts-side-facts > div{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--ts-line);display:flex;flex-direction:column;gap:2px;min-width:0}
.ts-side-facts span{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ts-muted)}
.ts-side-facts b{font:700 16px/1.15 'Rajdhani','Inter',sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-side-opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ts-side-label{width:100%;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ts-muted)}
.ts-side-none{font-size:13px;color:var(--ts-muted)}
.ts-opt{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#dce8ff;background:rgba(87,230,255,.1);border:1px solid rgba(87,230,255,.35)}
.ts-opt b{color:var(--ts-neon);font-weight:700}
.ts-invite{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;
  background:rgba(110,168,255,.08);border:1px dashed rgba(110,168,255,.45);color:#fff}
.ts-invite:hover{background:rgba(110,168,255,.16);border-style:solid}
.ts-invite span{font:700 14px/1 'Rajdhani','Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.ts-invite small{font-size:11px;color:var(--ts-muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-start{margin-top:auto}
/* Phone: compact side panel (small map, facts in a row, no long option list). */
@media(max-width:1023px){
  .ts-side{flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:8px;padding:10px 12px}
  .ts-side-map{width:110px;flex:none}
  .ts-side-map-name{font-size:13px;padding:10px 6px 4px}
  .ts-side-facts{flex:1;min-width:0;grid-template-columns:1fr 1fr;gap:4px}
  .ts-side-facts > div{padding:4px 7px}
  .ts-side-facts b{font-size:13px}
  .ts-side-opts{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ts-side-opts .ts-side-label{display:none}
  .ts-opt{flex:none;font-size:11px;padding:3px 8px}
  .ts-invite{display:none}
  .ts-start{width:100%}
}
@media(min-width:1024px){
  .ts-lobby-content map-picker .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr)) !important}
  .ts-lobby-content game-config-settings .grid.lg\:grid-cols-4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr)) !important}
  .ts-lobby-content game-config-settings .col-span-2{grid-column:span 2}
}
@media(max-width:1023px){
  .ts-side-map{width:96px;align-self:flex-start}
  .ts-side-map img,.ts-side-map-q{aspect-ratio:auto;height:64px}
  .ts-side-map-name{font-size:11px;padding:8px 5px 3px}
  .ts-side-facts span{font-size:9px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ts-side-facts b{font-size:12px}
  .ts-tab{padding:7px 11px;font-size:13px}
}
.ts-startin{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ts-startin .ts-side-label{width:100%}
.ts-startin-b{flex:1 0 auto;padding:6px 8px;border-radius:9px;cursor:pointer;font:700 13px/1 'Rajdhani','Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ts-muted);background:rgba(255,255,255,.04);border:1px solid var(--ts-line)}
.ts-startin-b:hover{color:#fff;border-color:rgba(110,168,255,.55)}
.ts-startin-b.on{color:#fff;background:linear-gradient(180deg,rgba(61,125,255,.3),rgba(87,230,255,.1));border-color:rgba(87,230,255,.7);box-shadow:0 0 12px rgba(87,230,255,.18)}
.ts-startin-b:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:1023px){.ts-startin .ts-side-label{display:none}.ts-startin{flex-wrap:nowrap;overflow-x:auto;margin-bottom:8px}.ts-startin-b{flex:none}}

.ts-invite:disabled{opacity:.5;cursor:wait;border-style:dashed}

    <!-- Scripts -->
    <script>
      // Remove preload class after everything is loaded
      window.addEventListener("load", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: remove preload class after timeout in case DOMContentLoaded never fires
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 3000);
    </script>

    <script>
      // Fallback sidebar toggle so hamburger works even if module bundle fails to load
      window.__toggleSidebar = function (e) {
        try {
          const sidebar = document.getElementById("sidebar-menu");
          const backdrop = document.getElementById("mobile-menu-backdrop");
          if (!sidebar || !backdrop) return;

          const isOpen = sidebar.classList.contains("open");

          if (isOpen) {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            document.documentElement.classList.remove("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "true");
            sidebar.removeAttribute("aria-modal");
            backdrop.setAttribute("aria-hidden", "true");
          } else {
            sidebar.classList.add("open");
            backdrop.classList.add("open");
            document.documentElement.classList.add("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "false");
            sidebar.setAttribute("aria-modal", "true");
            backdrop.setAttribute("aria-hidden", "false");
          }

          const hb = document.getElementById("hamburger-btn");
          if (hb) hb.setAttribute("aria-expanded", (!isOpen).toString());
        } catch (err) {
          console.error("Toggle failed", err);
        }
      };

      // Wire up the hamburger button inline
      const hamburger = document.getElementById("hamburger-btn");
      if (hamburger) {
        hamburger.onclick = window.__toggleSidebar;
        hamburger.setAttribute("aria-expanded", "false");
      }

      // Wire up backdrop click to close menu
      const backdrop = document.getElementById("mobile-menu-backdrop");
      if (backdrop) {
        backdrop.onclick = function (e) {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        };
      }

      // Wire up Escape key to close menu
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        }
      });
    </script>

    <script type="module" src="/src/client/Main.ts"></script>
